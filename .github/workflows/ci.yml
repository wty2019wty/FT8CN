name: CI 构建测试

on:
  # PR 提交（含更新）时自动触发
  pull_request:
    types: [opened, synchronize, reopened]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    name: 构建 Debug / Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 预装所需 SDK 组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ft8cn/gradle/wrapper/gradle-wrapper.properties', 'ft8cn/settings.gradle', 'ft8cn/build.gradle', 'ft8cn/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 执行构建与测试（含 lint）
        working-directory: ft8cn
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft8cn-apk
          path: ft8cn/app/build/outputs/apk/**/*.apk
